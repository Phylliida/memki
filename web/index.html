<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- interactive-widget=overlays-content: the on-screen keyboard overlays the
       page instead of resizing the viewport (Chrome Android 108+), so opening
       the keyboard never reflows or re-scrolls the page — scroll stays where
       the user put it. Desktop and unsupported browsers ignore the token. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content" />
  <meta name="theme-color" content="#191817" />
  <!-- Restore the saved theme before first paint (kept in sync by app.js). -->
  <script>
    document.documentElement.dataset.theme = localStorage.getItem("theme") || "dark";
  </script>
  <title>Memki</title>
  <!--
    Import map so the .apkg interop module's bare imports (fflate/fzstd) and
    sql.js resolve in the browser without a build step. All vendored under
    ../vendor/ (zero-network); they only load when you import/export a deck.
  -->
  <script type="importmap">
  {
    "imports": {
      "fflate": "../vendor/fflate.esm.js",
      "fzstd": "../vendor/fzstd.esm.js",
      "sql.js": "../vendor/sqljs/sqljs.esm.js"
    }
  }
  </script>
  <!-- MathJax for \( \) / \[ \] (all math syntaxes normalized by src/mathify.js). -->
  <script>
    window.MathJax = {
      chtml: { fontURL: "../vendor/mathjax/output/chtml/fonts/woff-v2" },
      tex: { inlineMath: [["\\(", "\\)"]], displayMath: [["\\[", "\\]"]] },
      options: { skipHtmlTags: ["script", "noscript", "style", "textarea", "pre"] },
      startup: { typeset: false },
    };
  </script>
  <script async src="../vendor/mathjax/tex-mml-chtml.js"></script>
  <link rel="stylesheet" href="../vendor/highlight-theme.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <button id="btn-menu" class="menu-btn" title="Menu" aria-label="Toggle menu" aria-expanded="false">☰</button>
      <div class="actions" hidden>
      <button id="btn-add">+ Card</button>
      <button id="btn-browse">Browse</button>
      <button id="btn-stats">Stats</button>
      <button id="btn-types">Types</button>
      <button id="btn-import" title="Import an .apkg/.colpkg deck, a .csv/.tsv spreadsheet, or restore a .json backup">Import</button>
      <button id="btn-backup" title="Download a full JSON backup (collection + media)">Backup</button>
      <button id="btn-history" title="Save/load history" hidden>History</button>
      <button id="btn-folder" title="Choose where to save" hidden>Folder</button>
      <button id="btn-theme" title="Toggle theme" aria-label="Toggle theme"></button>
      <input id="file-import" type="file" accept=".apkg,.colpkg,.json,.csv,.tsv,.txt,application/zip,application/octet-stream" hidden />
    </div>
    </div>
  </header>

  <!-- First-run gate when file-backed: block until a save folder/file is
       chosen. Driven by web/native-bridge.js (Android) or
       web/fs-access-bridge.js (desktop Chrome/Edge). -->
  <div id="folder-gate" class="folder-gate" hidden>
    <div class="folder-gate-card">
      <h2>Choose a save folder</h2>
      <p>
        Memki stores your whole collection as <code>memki.json</code> in a
        folder you choose, and rewrites it as you study and edit. Pick a folder
        your sync tool (Syncthing, …) watches to keep devices in sync.
      </p>
      <button id="btn-pick-folder">Choose folder</button>
      <p id="folder-gate-msg" class="muted"></p>
    </div>
  </div>

  <main id="view"></main>

  <script type="module" src="./app.js"></script>
</body>
</html>
