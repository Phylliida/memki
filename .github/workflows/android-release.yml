# Build, sign, and publish the release APK for each new version.
#
# Trigger model: runs on EVERY push to main (branch pushes fire reliably
# here; tag-push/create events in this repo don't reach Actions). The job
# reads versionName from android/app/build.gradle and exits early when a
# GitHub Release for that version already exists — so the release process
# is simply "bump versionName/versionCode + changelog, push main". The tag
# is created by `gh release create` (via GITHUB_TOKEN, which deliberately
# doesn't re-trigger other workflows). Manual dispatch on a tag still
# works for rebuilding an existing tagged release.
#
# This is the upstream-signed APK that F-Droid's Reproducible Builds
# verify against: the fdroiddata metadata `Binaries:` URL points at the
# release asset (…/releases/download/v%v/memki-%v.apk), and F-Droid
# ships OUR signature after proving their source build is identical.
#
# Required Actions secrets (Settings → Secrets and variables → Actions):
#   MEMKI_KEYSTORE_B64       base64 of the release .keystore file
#   MEMKI_KEYSTORE_PASSWORD  keystore password
#   MEMKI_KEY_ALIAS          key alias
#   MEMKI_KEY_PASSWORD       key password

name: Build + sign + publish release APK

on:
  push:
    branches: [main]
    tags: ['v*'] # harmless if these events do arrive someday
  create: # same
  workflow_dispatch: {}

permissions:
  contents: write # create the GitHub Release + tag

jobs:
  release:
    # `create` fires for branches too — only tags may build a release.
    if: github.event_name != 'create' || github.event.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version source of truth: android/app/build.gradle (branch push).
      # Manual dispatch on a tag uses the tag name instead.
      - name: Determine version
        id: ver
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          fi
          [ -n "$VER" ] || { echo "could not determine version"; exit 1; }
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "Building release for version $VER"

      - name: Skip if this release already exists
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.ver }}" >/dev/null 2>&1; then
            echo "Release v${{ steps.ver.outputs.ver }} already exists — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.gate.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS deps
        if: steps.gate.outputs.skip == 'false'
        run: npm ci

      # F-Droid's scanner rejects the prebuilt sql-wasm.wasm shipped by the
      # npm sql.js package, so the F-Droid recipe compiles sql.js from source
      # with the buildserver's emscripten (Debian trixie). Do the identical
      # build here — in a trixie container, so the toolchain matches — or the
      # wasm bytes differ and reproducible-builds verification fails.
      - name: Build sql.js from source (Debian trixie, matches F-Droid)
        if: steps.gate.outputs.skip == 'false'
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src debian:trixie \
            bash -c 'set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                emscripten make curl unzip libdigest-sha3-perl git ca-certificates nodejs
              bash scripts/build-sqljs-from-source.sh
              chown -R --reference=package.json vendor'

      - name: Build Capacitor webDir
        if: steps.gate.outputs.skip == 'false'
        run: bash scripts/build-capacitor.sh

      # JDK 21: F-Droid's buildserver builds with openjdk-21, and D8/baseline
      # profiles differ between JDK majors — the JDK must match or
      # reproducible-builds verification fails on classes.dex.
      - name: Setup JDK
        if: steps.gate.outputs.skip == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Sync Capacitor
        if: steps.gate.outputs.skip == 'false'
        run: npx cap sync android

      # Unsigned first: signing is a separate apksigner step, so the
      # build itself stays byte-identical to F-Droid's unsigned build.
      - name: Build unsigned release APK
        if: steps.gate.outputs.skip == 'false'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign with release keystore
        if: steps.gate.outputs.skip == 'false'
        id: sign
        env:
          MEMKI_KEYSTORE_B64: ${{ secrets.MEMKI_KEYSTORE_B64 }}
          MEMKI_KEYSTORE_PASSWORD: ${{ secrets.MEMKI_KEYSTORE_PASSWORD }}
          MEMKI_KEY_ALIAS: ${{ secrets.MEMKI_KEY_ALIAS }}
          MEMKI_KEY_PASSWORD: ${{ secrets.MEMKI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          K="$RUNNER_TEMP/release.keystore"
          echo "$MEMKI_KEYSTORE_B64" | base64 -d > "$K"
          # Fail loudly and specifically if the secret is missing/broken:
          # an empty or truncated MEMKI_KEYSTORE_B64 decodes to a file the
          # PKCS12 parser rejects with a cryptic DER error downstream.
          echo "b64 chars: ${#MEMKI_KEYSTORE_B64}, decoded bytes: $(wc -c < "$K")"
          [ -s "$K" ] || { echo "MEMKI_KEYSTORE_B64 is empty — check the secret name and value"; exit 1; }
          keytool -list -keystore "$K" -storepass "$MEMKI_KEYSTORE_PASSWORD" \
            | grep -i "alias\|type" || { echo "keystore unreadable: bad file or wrong MEMKI_KEYSTORE_PASSWORD"; exit 1; }
          OUT="memki-${{ steps.ver.outputs.ver }}.apk"
          # Pin apksigner to build-tools 34.0.0: 35+ realigns ZIP entries
          # (16KB page support, 0xd935 extra fields) while signing, which
          # makes the signed APK differ from F-Droid's unsigned build and
          # breaks reproducible-builds verification.
          BT="$ANDROID_HOME/build-tools/34.0.0"
          [ -x "$BT/apksigner" ] || { echo "build-tools 34.0.0 apksigner not found"; exit 1; }
          "$BT/apksigner" sign \
            --ks "$K" \
            --ks-pass "pass:$MEMKI_KEYSTORE_PASSWORD" \
            --ks-key-alias "$MEMKI_KEY_ALIAS" \
            --key-pass "pass:$MEMKI_KEY_PASSWORD" \
            --out "$OUT" \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/apksigner" verify --print-certs "$OUT" | head -2
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      # Creates the tag too when it doesn't exist yet (at --target); with
      # an existing tag (e.g. v1.0.5) the release simply uses it.
      # NOTE: block scalar (|) — a plain scalar folds newlines into spaces
      # and breaks the shell line-continuations.
      - name: Publish GitHub Release (+ tag if needed)
        if: steps.gate.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.ver }}" "${{ steps.sign.outputs.apk }}" \
            --title "v${{ steps.ver.outputs.ver }}" --generate-notes \
            --target "${{ github.sha }}"
