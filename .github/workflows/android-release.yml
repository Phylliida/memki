# Build, sign, and publish the release APK for each version tag.
#
# This is the upstream-signed APK that F-Droid's Reproducible Builds
# verify against: the fdroiddata metadata `Binaries:` URL points at the
# release asset (…/releases/download/v%v/memki-%v.apk), and F-Droid
# ships OUR signature after proving their source build is identical.
#
# Required Actions secrets (Settings → Secrets and variables → Actions):
#   MEMKI_KEYSTORE_B64       base64 of the release .keystore file
#   MEMKI_KEYSTORE_PASSWORD  keystore password
#   MEMKI_KEY_ALIAS          key alias
#   MEMKI_KEY_PASSWORD       key password
#
# Trigger: pushing a version tag (v*) or manual dispatch.

name: Build + sign + publish release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write # create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS deps
        run: npm ci

      - name: Build Capacitor webDir
        run: bash scripts/build-capacitor.sh

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Sync Capacitor
        run: npx cap sync android

      # Unsigned first: signing is a separate apksigner step, so the
      # build itself stays byte-identical to F-Droid's unsigned build.
      - name: Build unsigned release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign with release keystore
        id: sign
        env:
          MEMKI_KEYSTORE_B64: ${{ secrets.MEMKI_KEYSTORE_B64 }}
          MEMKI_KEYSTORE_PASSWORD: ${{ secrets.MEMKI_KEYSTORE_PASSWORD }}
          MEMKI_KEY_ALIAS: ${{ secrets.MEMKI_KEY_ALIAS }}
          MEMKI_KEY_PASSWORD: ${{ secrets.MEMKI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$MEMKI_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          VER="${GITHUB_REF_NAME#v}" # v1.0.4 → 1.0.4
          OUT="memki-$VER.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass "pass:$MEMKI_KEYSTORE_PASSWORD" \
            --ks-key-alias "$MEMKI_KEY_ALIAS" \
            --key-pass "pass:$MEMKI_KEY_PASSWORD" \
            --out "$OUT" \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/apksigner" verify --print-certs "$OUT" | head -2
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.sign.outputs.apk }}" \
          --title "$GITHUB_REF_NAME" --generate-notes
